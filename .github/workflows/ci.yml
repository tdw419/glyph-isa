name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run test suite
      run: |
        pytest tests/

    - name: Verify CLI & Canonical Examples
      run: |
        ./glyphc build examples/01_hello.glyph -o hello.png
        ./glyphc run hello.png
        ./glyphc verify hello.png
        ./glyphc disasm hello.png

        ./glyphc build examples/02_counter.glyph -o counter.png
        ./glyphc run counter.png

        ./glyphc build examples/03_fibonacci.glyph -o fib.png
        ./glyphc run fib.png

        ./glyphc build examples/04_mailbox.glyph -o mailbox.png
        ./glyphc run mailbox.png
